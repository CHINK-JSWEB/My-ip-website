<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-IP-Address | Jonnel Soriano</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Google Font: Orbitron (Futuristic) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="site-header">
            <div class="logo-section">
                <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
                </svg>
                <h1 class="site-title">My-IP-Address</h1>
            </div>
            <p class="site-subtitle">Discover Your Digital Identity</p>
        </header>

        <!-- Main IP Card -->
        <div class="card main-card">
            <h2 class="card-title">
                <svg class="icon-inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                Your IP Address
            </h2>
            <div id="ip" class="ip-display">
                <span class="loading-spinner"></span>
                Loading...
            </div>
            <p class="ip-subtitle">Your unique identifier on the internet</p>
        </div>

        <!-- Info Grid -->
        <div class="card">
            <h2 class="card-title">
                <svg class="icon-inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Network Information
            </h2>
            <div class="info-grid" id="info">
                <div class="info-item skeleton"></div>
                <div class="info-item skeleton"></div>
                <div class="info-item skeleton"></div>
                <div class="info-item skeleton"></div>
            </div>
        </div>

        <!-- Map Card -->
        <div class="card">
            <h2 class="card-title">
                <svg class="icon-inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Your Location on Satellite View
            </h2>
            <div id="map"></div>
            <button id="traceroute-btn" class="btn-primary">
                <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                Visual Traceroute
            </button>
        </div>
    </div>
    
    <footer class="site-footer">
        <div class="footer-content">
            <p class="footer-main">© 2025 <strong>Jonnel Soriano</strong>. All Rights Reserved.</p>
            <p class="footer-credit">Developed by Jonnel Soriano | Powered by Free APIs</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Privacy</a>
                <span class="footer-dot">•</span>
                <a href="#" class="footer-link">Terms</a>
                <span class="footer-dot">•</span>
                <a href="#" class="footer-link">Contact</a>
            </div>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
