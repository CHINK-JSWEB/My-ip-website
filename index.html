<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ano ang Aking IP? | Jonnel Soriano</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Google Font: Orbitron (Futuristic) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <!-- IMPORTANT: Inject Render Environment Variables -->
    <script>
        window.env = {
            TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}",
            TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>
                <svg class="svg-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
                </svg>
                Ano ang Iyong IP Address?
            </h1>
            <div id="ip" class="ip-display">Loading...</div>
            
            <div class="info-grid" id="info"></div>
            
            <button id="traceroute-btn">Visual Traceroute sa Mapa</button>
        </div>
        
        <div class="card">
            <h2>Iyong Lokasyon sa Satellite View</h2>
            <div id="map"></div>
        </div>
    </div>
    
    <footer>
        © 2025 Jonnel Soriano. All Rights Reserved.<br>
        Credit: Developed by Jonnel Soriano | Powered by Free APIs
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
